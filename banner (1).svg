<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Vivek Kumar Gupta - AI Engineer | Software Developer | Systems Builder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65D6AD"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1018"/>
      <stop offset="1" stop-color="#0F1A2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#65D6AD" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#65D6AD" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1A2638" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)" opacity="0.55"/>
    <rect width="1000" height="260" fill="url(#glow)"/>

    <!-- title bar -->
    <rect width="1000" height="36" fill="#111B29"/>
    <rect y="36" width="1000" height="1" fill="#283344"/>
    <circle cx="24" cy="18" r="5.5" fill="#FF5F57" opacity="0.85"/>
    <circle cx="44" cy="18" r="5.5" fill="#FEBC2E" opacity="0.85"/>
    <circle cx="64" cy="18" r="5.5" fill="#65D6AD" opacity="0.95"/>
    <text x="500" y="23" text-anchor="middle" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#94A3B8">vivek@mrjarvisop: ~/profile</text>

    <!-- faint code block on right -->
    <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" opacity="0.5">
      <text x="700" y="92" fill="#94A3B8">{</text>
      <text x="716" y="114"><tspan fill="#22D3EE">"role"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#65D6AD">"AI Engineer"</tspan><tspan fill="#94A3B8">,</tspan></text>
      <text x="716" y="136"><tspan fill="#22D3EE">"focus"</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#65D6AD">"LLM"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#65D6AD">"RAG"</tspan><tspan fill="#94A3B8">],</tspan></text>
      <text x="716" y="158"><tspan fill="#22D3EE">"backend"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#65D6AD">"Python"</tspan><tspan fill="#94A3B8">,</tspan></text>
      <text x="716" y="180"><tspan fill="#22D3EE">"base"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#65D6AD">"Noida, IN"</tspan></text>
      <text x="700" y="202" fill="#94A3B8">}</text>
    </g>

    <!-- main text -->
    <text x="40" y="82" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#65D6AD">$ whoami</text>
    <text x="40" y="132" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="46" font-weight="700" fill="url(#accent)">VIVEK KUMAR GUPTA</text>
    <rect x="40" y="144" width="120" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="40" y="176" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="18" fill="#F1F5F9">AI Engineer <tspan fill="#65D6AD">|</tspan> Software Developer <tspan fill="#65D6AD">|</tspan> Systems Builder</text>

    <!-- chips -->
    <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#94A3B8">
      <rect x="40"  y="204" width="71"  height="26" rx="13" fill="#111B29" stroke="#283344"/><text x="75.5"  y="221" text-anchor="middle">Python</text>
      <rect x="121" y="204" width="79"  height="26" rx="13" fill="#111B29" stroke="#283344"/><text x="160.5" y="221" text-anchor="middle">FastAPI</text>
      <rect x="210" y="204" width="94"  height="26" rx="13" fill="#111B29" stroke="#283344"/><text x="257"   y="221" text-anchor="middle">LangGraph</text>
      <rect x="314" y="204" width="118" height="26" rx="13" fill="#111B29" stroke="#283344"/><text x="373"   y="221" text-anchor="middle">Azure OpenAI</text>
      <rect x="442" y="204" width="47"  height="26" rx="13" fill="#111B29" stroke="#283344"/><text x="465.5" y="221" text-anchor="middle">RAG</text>
      <rect x="499" y="204" width="47"  height="26" rx="13" fill="#111B29" stroke="#283344"/><text x="522.5" y="221" text-anchor="middle">OCR</text>
      <rect x="556" y="204" width="102" height="26" rx="13" fill="#111B29" stroke="#283344"/><text x="607"   y="221" text-anchor="middle">PostgreSQL</text>
    </g>

    <!-- accent edge -->
    <rect y="257" width="1000" height="3" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="259" rx="14" fill="none" stroke="#283344"/>
</svg>
